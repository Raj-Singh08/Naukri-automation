# ------------------------------------------------------------------
#  Naukri Resume Auto Updater — scheduled profile refresh
#
#  Runs three times a day (09:00 / 12:00 / 15:00 UTC) and on manual
#  trigger. Logs into Naukri, toggles the profile summary, re-uploads
#  resume/Resume.pdf, saves the profile and stores a screenshot.
#
#  Credentials come from GitHub Secrets:
#    NAUKRI_EMAIL     your Naukri login email
#    NAUKRI_PASSWORD  your Naukri password
#
#  See the README → "GitHub Secrets" and "Changing schedule" sections.
# ------------------------------------------------------------------
name: Update Naukri Profile

on:
  schedule:
    # GitHub Actions cron runs in UTC. Adjust to your timezone if needed.
    # minute hour day-of-month month day-of-week
    - cron: '0 9 * * *'   # 09:00 UTC
    - cron: '0 12 * * *'  # 12:00 UTC
    - cron: '0 15 * * *'  # 15:00 UTC
  workflow_dispatch: {}   # lets you click "Run workflow" in the GitHub UI

permissions:
  contents: read

jobs:
  update-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium (with system dependencies)
        run: npx playwright install --with-deps chromium

      - name: Run profile automation
        run: npm run start
        env:
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}

      # Always upload screenshots — even when a run fails, the failure
      # screenshot lands in the artifact so you can see what happened.
      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn
